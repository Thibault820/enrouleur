<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Test LED Firebase</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{ --bg:#0f1714; --card:#17231e; --line:#26392f; --ink:#e6f0ea; --muted:#8ea79a; --ok:#3ccf7d; --off:#3a4a42; --err:#f06b62; --blue:#4ea6e2; color-scheme:dark; }
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;margin:0 auto;padding:20px 16px;display:grid;gap:14px}
  h1{font-size:20px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
  label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
  input{font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f1714;color:var(--ink)}
  button{font:inherit;font-size:16px;font-weight:600;padding:12px;border-radius:10px;border:0;cursor:pointer;background:var(--ok);color:#06170e}
  button.sec{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:14px;padding:8px}
  .lamp{width:110px;height:110px;border-radius:50%;margin:6px auto;background:var(--off);transition:background .2s, box-shadow .2s}
  .lamp.on{background:var(--blue);box-shadow:0 0 40px var(--blue)}
  .row{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
  .row:last-child{border:0} .row span:first-child{color:var(--muted)}
  .center{text-align:center} .err{color:var(--err);font-size:13px;min-height:1em;margin:0}
  .ok{color:var(--ok)} .bad{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>💡 Test LED ESP32 ↔ Firebase</h1>

  <form class="card" id="login">
    <label>E-mail<input id="mail" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input id="pass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lgErr"></p>
    <button type="submit">Se connecter</button>
  </form>

  <section id="app" hidden style="display:grid;gap:14px">
    <div class="card center">
      <div class="lamp" id="lamp"></div>
      <div id="lampTxt" style="font-size:15px">LED réelle : —</div>
      <button id="btn">Allumer</button>
      <div id="cmdTxt" style="font-size:13px;color:var(--muted)">Commande envoyée : —</div>
    </div>
    <div class="card">
      <div class="row"><span>ESP32</span><span id="esp">—</span></div>
      <div class="row"><span>Dernier message</span><span id="age">—</span></div>
      <div class="row"><span>Signal WiFi</span><span id="rssi">—</span></div>
      <div class="row"><span>Allumé depuis</span><span id="up">—</span></div>
      <div class="row"><span>Délai commande → LED</span><span id="lat">—</span></div>
    </div>
    <button class="sec" id="out">Se déconnecter</button>
  </section>
</main>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDOilyX1JmD_nuPkC6JE7QW_GhBcdKcM0I",
  authDomain: "enrouleur-eda1f.firebaseapp.com",
  databaseURL: "https://enrouleur-eda1f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "enrouleur-eda1f",
  appId: "1:1028823014289:web:68da82933d870698ff9830"
});
const auth = firebase.auth(), db = firebase.database();
const $ = id => document.getElementById(id);
let cmd = null, etat = null, offset = 0, tEnvoi = null;

db.ref(".info/serverTimeOffset").on("value", s => offset = s.val() || 0);
const nowServ = () => Date.now() + offset;

function draw(){
  $("btn").textContent = cmd ? "Éteindre" : "Allumer";
  $("cmdTxt").textContent = "Commande envoyée : " + (cmd === null ? "—" : cmd ? "allumer" : "éteindre");
  if(!etat){ $("esp").innerHTML = '<span class="bad">jamais vu</span>'; return; }
  $("lamp").classList.toggle("on", !!etat.led);
  $("lampTxt").textContent = "LED réelle : " + (etat.led ? "allumée" : "éteinte");
  const age = Math.max(0, Math.round((nowServ() - etat.ts) / 1000));
  $("age").textContent = age < 90 ? "il y a " + age + " s" : "il y a " + Math.round(age/60) + " min";
  $("esp").innerHTML = age < 15 ? '<span class="ok">en ligne</span>' : '<span class="bad">hors ligne</span>';
  $("rssi").textContent = etat.rssi + " dBm";
  const u = etat.uptime_s; $("up").textContent = u < 3600 ? Math.floor(u/60)+" min "+(u%60)+" s" : Math.floor(u/3600)+" h "+Math.floor(u%3600/60)+" min";
}

auth.onAuthStateChanged(user => {
  $("login").hidden = !!user; $("app").hidden = !user;
  if(!user) return;
  db.ref("test/cmd/led").on("value", s => { cmd = s.val(); draw(); });
  db.ref("test/etat").on("value", s => {
    const prev = etat && etat.led; etat = s.val();
    if(tEnvoi && etat && etat.led === cmd && prev !== etat.led){ $("lat").textContent = ((Date.now()-tEnvoi)/1000).toFixed(1) + " s"; tEnvoi = null; }
    draw();
  }, e => $("esp").textContent = "Accès refusé : " + e.message);
});
setInterval(draw, 1000);

$("btn").onclick = () => { tEnvoi = Date.now(); db.ref("test/cmd/led").set(!cmd); };
$("out").onclick = () => auth.signOut();
$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("lgErr").textContent = "";
  try{ await auth.signInWithEmailAndPassword($("mail").value.trim(), $("pass").value); }
  catch(x){ $("lgErr").textContent = x.code === "auth/invalid-credential" ? "E-mail ou mot de passe incorrect." : x.message; }
});
</script>
</body>
</html>
